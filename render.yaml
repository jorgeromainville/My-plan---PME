# Blueprint de Render para el backend de My Plan.
# Al crear el servicio, Render pide los valores marcados con `sync: false`
# (secretos que no deben vivir en el repo).
services:
  - type: web
    name: my-plan-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OCR_PROVIDER
        value: ocrspace
      - key: OCRSPACE_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_MODEL_FALLBACKS
        value: gemini-3-flash-preview,gemini-flash-latest
      - key: GOOGLE_CLIENT_ID
        sync: false
