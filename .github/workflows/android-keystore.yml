name: Android keystore

# Crea la llave de subida a Play Store una sola vez, sin instalar Java en tu PC.
# Descarga el artefacto y guarda los 4 secretos que indica el README.
#
# Guárdala: si la pierdes y aún no publicaste nada, hay que crear una nueva y
# pedir a Google el reinicio de la llave de carga. Si ya publicaste, se pierde la
# posibilidad de subir actualizaciones (la de firma la guarda Google).

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Alias de la llave'
        type: string
        default: upload
      password:
        description: 'Contraseña (mínimo 12 caracteres). Sustituye el valor por defecto.'
        type: string
        default: 'cambia-esta-clave-2026'

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar la contraseña
        run: |
          if [ ${#PASSWORD} -lt 12 ]; then
            echo "::error::La contraseña debe tener al menos 12 caracteres."
            exit 1
          fi
        env:
          PASSWORD: ${{ inputs.password }}

      - name: Generar la llave
        env:
          ALIAS: ${{ inputs.alias }}
          PASSWORD: ${{ inputs.password }}
        run: |
          keytool -genkeypair -v \
            -keystore upload.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storetype PKCS12 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=My Plan, OU=Mobile, O=My Plan, L=Lima, ST=Lima, C=PE"
          base64 -w0 upload.keystore > upload.keystore.base64
          {
            echo "Guarda este archivo en un lugar seguro. No lo subas al repositorio."
            echo
            echo "Secretos del repositorio (Settings > Secrets and variables > Actions):"
            echo "  MYPLAN_KEYSTORE_BASE64    = contenido de upload.keystore.base64"
            echo "  MYPLAN_KEYSTORE_PASSWORD  = $PASSWORD"
            echo "  MYPLAN_KEY_ALIAS          = $ALIAS"
            echo "  MYPLAN_KEY_PASSWORD       = $PASSWORD"
            echo
            echo "Al publicar por primera vez, Play Console pedirá registrar esta llave"
            echo "como llave de subida (Play App Signing)."
          } > LEEME.txt

      - uses: actions/upload-artifact@v4
        with:
          name: myplan-upload-keystore
          path: |
            upload.keystore
            upload.keystore.base64
            LEEME.txt
          retention-days: 1
