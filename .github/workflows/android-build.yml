name: Android build

# Compila el AAB (o APK) de release sin EAS, en un runner de GitHub que ya trae
# JDK y Android SDK. No requiere nada instalado en tu PC.
#
# Secretos del repositorio (opcionales al principio, obligatorios para Play):
#   MYPLAN_KEYSTORE_BASE64    keystore en base64 (ver workflow "Android keystore")
#   MYPLAN_KEYSTORE_PASSWORD  contraseña del keystore
#   MYPLAN_KEY_ALIAS          alias (por defecto `upload`)
#   MYPLAN_KEY_PASSWORD       contraseña de la llave
#   EXPO_PUBLIC_API_URL       API del backend (por defecto la de Render)
#   EXPO_PUBLIC_GOOGLE_MAPS_KEY
#
# Sin el keystore el build sale firmado con la llave debug: sirve para probar en
# un teléfono, NO para Play Store.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Qué generar'
        type: choice
        options: [aab, apk]
        default: aab
      version_code:
        description: 'versionCode (vacío = el de app.json)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://my-plan-api.onrender.com' }}
      EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}
      MYPLAN_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Firma con la llave de Play
        env:
          MYPLAN_KEYSTORE_BASE64: ${{ secrets.MYPLAN_KEYSTORE_BASE64 }}
          MYPLAN_KEYSTORE_PASSWORD: ${{ secrets.MYPLAN_KEYSTORE_PASSWORD }}
          MYPLAN_KEY_ALIAS: ${{ secrets.MYPLAN_KEY_ALIAS }}
          MYPLAN_KEY_PASSWORD: ${{ secrets.MYPLAN_KEY_PASSWORD }}
        run: |
          if [ -n "$MYPLAN_KEYSTORE_BASE64" ]; then
            echo "$MYPLAN_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
            echo "MYPLAN_KEYSTORE_PATH=upload.keystore" >> "$GITHUB_ENV"
            echo "Firmando con la llave de subida."
          else
            echo "::warning::Sin MYPLAN_KEYSTORE_BASE64: el build se firma con la llave debug. No sirve para Play Store."
          fi
          node scripts/patch-signing.mjs

      - name: Compilar AAB
        if: ${{ inputs.variant == 'aab' }}
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Compilar APK
        if: ${{ inputs.variant == 'apk' }}
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Subir AAB
        if: ${{ inputs.variant == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: myplan-aab-${{ github.run_number }}
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Subir APK
        if: ${{ inputs.variant == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: myplan-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
