name: Android build

# Compila el AAB (o APK) de release sin EAS, en un runner de GitHub que ya trae
# JDK y Android SDK. No requiere nada instalado en tu PC.
#
# Secretos del repositorio (opcionales al principio, obligatorios para Play):
#   MYPLAN_KEYSTORE_BASE64    keystore en base64 (ver workflow "Android keystore")
#   MYPLAN_KEYSTORE_PASSWORD  contraseña del keystore
#   MYPLAN_KEY_ALIAS          alias (por defecto `upload`)
#   MYPLAN_KEY_PASSWORD       contraseña de la llave
#   EXPO_PUBLIC_API_URL       API del backend (por defecto la de Render)
#   EXPO_PUBLIC_GOOGLE_MAPS_KEY
#
# Sin el keystore el build sale firmado con la llave debug: sirve para probar en
# un teléfono, NO para Play Store.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Qué generar'
        type: choice
        options: [aab, apk]
        default: aab
      version_code:
        description: 'versionCode (vacío = el de app.json)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://my-plan-api.onrender.com' }}
      EXPO_PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      # Expo SDK 57 llama a `mirror-kotlin-inline-modules` con una lista vacía y
      # con rutas fuera de "android/": el comando sale con 1 y Gradle muere con
      # "Process 'command 'node'' finished with non-zero exit value 1".
      # El parche lo deja como no-op (no usamos módulos inline). Ver el script.
      - name: Parchear autolinking de Expo
        run: node scripts/patch-expo-autolinking.mjs

      # El versionCode se fija aquí (no en Gradle): `expo prebuild` lo copia como
      # literal y así no hay expresiones de Groovy que puedan fallar.
      - name: Aplicar versionCode de la entrada
        if: ${{ inputs.version_code != '' }}
        env:
          MYPLAN_VERSION_CODE: ${{ inputs.version_code }}
        run: node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.android.versionCode=Number(process.env.MYPLAN_VERSION_CODE);fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\n');console.log('versionCode ->',j.android.versionCode)"

      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Firma con la llave de Play
        env:
          MYPLAN_KEYSTORE_BASE64: ${{ secrets.MYPLAN_KEYSTORE_BASE64 }}
          MYPLAN_KEYSTORE_PASSWORD: ${{ secrets.MYPLAN_KEYSTORE_PASSWORD }}
          MYPLAN_KEY_ALIAS: ${{ secrets.MYPLAN_KEY_ALIAS }}
          MYPLAN_KEY_PASSWORD: ${{ secrets.MYPLAN_KEY_PASSWORD }}
        run: |
          if [ -n "$MYPLAN_KEYSTORE_BASE64" ]; then
            echo "$MYPLAN_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore
            echo "MYPLAN_KEYSTORE_PATH=upload.keystore" >> "$GITHUB_ENV"
            echo "Firmando con la llave de subida."
          else
            echo "::warning::Sin MYPLAN_KEYSTORE_BASE64: el build se firma con la llave debug. No sirve para Play Store."
          fi
          node scripts/patch-signing.mjs

      - name: Más memoria para Gradle (NDK / New Arch)
        working-directory: mobile/android
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties

      - name: Compilar AAB
        if: ${{ inputs.variant == 'aab' }}
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      # APK para compartir: solo ARM (los teléfonos reales). Sin x86/x86_64 el
      # archivo baja a la mitad y compila mucho más rápido.
      - name: Compilar APK
        if: ${{ inputs.variant == 'apk' }}
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Subir AAB
        if: ${{ inputs.variant == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: myplan-aab-${{ github.run_number }}
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Subir APK
        if: ${{ inputs.variant == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: myplan-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # El stderr del comando de autolinking no llega al log de Gradle: el
      # parche lo deja en este archivo. Se imprime siempre, falle o no.
      - name: Revisar autolinking
        if: always()
        working-directory: .
        run: |
          if [ -f autolinking-error.log ]; then
            echo "::warning::El comando de autolinking falló:"
            cat autolinking-error.log
          else
            echo "Sin errores de autolinking."
          fi

      # Huella del certificado: es la que se registra en Google Cloud para que
      # funcione el inicio de sesión con Google (cliente OAuth de Android).
      - name: Huella de la firma
        if: ${{ inputs.variant == 'apk' }}
        working-directory: mobile/android
        run: ./gradlew -q signingReport 2>&1 | grep -E "Variant:|Config:|Alias:|SHA-1:|SHA-256:" || true
